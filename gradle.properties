# AGP 8.10.1 官方支持到 JDK 21；本机 PATH 上是 JDK 25，会让 AGP 启动失败。
# 这里显式固定到本机已安装的 Temurin 21。换机器时改成该机器的 JDK 21 路径，
# 或在 Android Studio 的 Settings > Build Tools > Gradle > Gradle JDK 里覆盖。
org.gradle.java.home=C:/Users/ming/.gradle/jdks/eclipse_adoptium-21-amd64-windows.2

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=false
android.nonTransitiveRClass=true
