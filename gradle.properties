# 团队共享配置：不要在这里写任何与本机路径相关的内容，否则别人 clone 后构建会直接失败。
#
# JDK 要求：Gradle 8.11.1 只支持在 JDK 17–23 上运行（推荐 21）。
# 如果你的机器默认 JDK 不在这个范围，用下面任一方式指定，而不要改本文件：
#   - Android Studio：Settings → Build, Execution, Deployment → Build Tools → Gradle → Gradle JDK
#   - 命令行：export JAVA_HOME=/path/to/jdk-21  （Windows：set JAVA_HOME=...）
#   - 或在本机 ~/.gradle/gradle.properties 里加 org.gradle.java.home=...
# 详见 README 的「环境要求」。

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=false
android.nonTransitiveRClass=true
